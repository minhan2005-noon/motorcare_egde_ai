<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotorCare Edge AI - Đăng ký</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff0e3;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 170px 24px 92px;
      overflow: hidden;
      background: #fff0e3;
    }

    .brand {
      position: absolute;
      top: clamp(42px, 9vh, 86px);
      left: clamp(28px, 12vw, 112px);
      display: grid;
      grid-template-columns: 38px auto;
      column-gap: 15px;
      align-items: start;
      z-index: 2;
    }

    .mark {
      width: 34px;
      height: 58px;
      margin-top: 1px;
    }

    .brand-name {
      margin: 0;
      font-size: 18px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .tagline {
      grid-column: 2;
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 400;
      letter-spacing: 3.4px;
      text-transform: uppercase;
    }

    .login-area {
      position: relative;
      width: min(480px, 88vw);
      z-index: 3;
      text-align: center;
    }

    .login-card {
      position: relative;
      height: 242px;
      padding: 44px 54px 36px;
      border-radius: 50px;
      background: #e7b98f;
      box-shadow: 25px 22px 0 #bc8152;
      text-align: left;
    }

    .field {
      display: flex;
      align-items: center;
      height: 64px;
    }

    .icon {
      width: 44px;
      height: 34px;
      flex: 0 0 44px;
      margin-right: 18px;
      position: relative;
      display: inline-block;
    }

    .icon.mail {
      width: 33px;
      height: 22px;
      margin-left: 3px;
      border: 1.6px solid rgba(48, 62, 58, 0.7);
      border-radius: 3px;
      transform: rotate(-12deg);
    }

    .icon.mail::before,
    .icon.mail::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 18px;
      height: 1.6px;
      background: rgba(48, 62, 58, 0.7);
    }

    .icon.mail::before {
      left: 1px;
      transform: rotate(28deg);
      transform-origin: left center;
    }

    .icon.mail::after {
      right: 1px;
      transform: rotate(-28deg);
      transform-origin: right center;
    }

    .icon.fingerprint {
      width: 34px;
      height: 34px;
      border: 1.6px solid rgba(48, 62, 58, 0.75);
      border-radius: 50%;
    }

    .icon.fingerprint::before,
    .icon.fingerprint::after {
      content: "";
      position: absolute;
      border: 1.4px solid rgba(48, 62, 58, 0.55);
      border-radius: 50%;
      inset: 5px;
    }

    .icon.fingerprint::after {
      inset: 10px;
    }

    .icon.user {
      width: 32px;
      height: 32px;
      border: 1.6px solid rgba(48, 62, 58, 0.75);
      border-radius: 50%;
    }

    .icon.user::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 6px;
      width: 10px;
      height: 10px;
      border: 1.4px solid rgba(48, 62, 58, 0.65);
      border-radius: 50%;
    }

    .icon.user::after {
      content: "";
      position: absolute;
      left: 6px;
      bottom: 6px;
      width: 17px;
      height: 9px;
      border: 1.4px solid rgba(48, 62, 58, 0.65);
      border-radius: 50% 50% 0 0;
      border-bottom: 0;
    }

    .register-card {
      height: 286px;
      padding-top: 38px;
    }

    .forgot-card {
      height: 242px;
      padding-top: 36px;
    }

    .form-title,
    .form-note {
      margin: 0;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2.6px;
    }

    .form-title {
      margin-bottom: 20px;
      font-size: 15px;
      font-weight: 700;
    }

    .form-note {
      margin-top: 17px;
      font-size: 12px;
    }

    .field input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 17px;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      caret-color: #111;
    }

    .field input::placeholder {
      color: #111;
      opacity: 1;
    }

    .field input:focus {
      background: transparent;
    }

    .field input:-webkit-autofill,
    .field input:-webkit-autofill:hover,
    .field input:-webkit-autofill:focus,
    .field input:-webkit-autofill:active {
      -webkit-text-fill-color: #111;
      caret-color: #111;
      box-shadow: 0 0 0 1000px #e7b98f inset;
      transition: background-color 9999s ease-in-out 0s;
    }

    .forgot {
      display: block;
      margin-top: 20px;
      padding-right: 18px;
      color: #111;
      font-size: 15px;
      letter-spacing: 2.8px;
      text-align: right;
      text-decoration: none;
      text-transform: uppercase;
    }

    .actions {
      margin-top: 30px;
      display: grid;
      justify-content: center;
      gap: 18px;
      overflow: visible;
    }

    .btn {
      position: relative;
      isolation: isolate;
      width: 300px;
      height: 51px;
      border: 2px solid #242424;
      border-radius: 10px;
      background: #bfe0fa;
      color: #111;
      font-size: 14px;
      font-weight: 700;
      text-transform: lowercase;
      cursor: pointer;
      appearance: none;
      box-shadow: 0 7px 0 #6f93af, 0 14px 22px rgba(53, 76, 91, 0.22);
      transition: transform 140ms ease, background 160ms ease, box-shadow 140ms ease;
    }

    .btn:hover {
      background: #a8d4f6;
      transform: translateY(-3px);
      box-shadow: 0 10px 0 #6f93af, 0 18px 28px rgba(53, 76, 91, 0.25);
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #6f93af, 0 7px 13px rgba(53, 76, 91, 0.2);
    }

    .bubble {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: -1;
      width: var(--s);
      height: var(--s);
      border-radius: 999px;
      pointer-events: none;
      background: radial-gradient(circle at 35% 32%, #ffffff 0 16%, #dff2ff 18% 38%, rgba(46, 160, 214, 0.34) 40% 100%);
      box-shadow: inset -3px -4px 8px rgba(23, 103, 139, 0.22), 0 5px 10px rgba(36, 105, 139, 0.18);
      animation: bubble-pop 720ms ease-out forwards;
    }

    @keyframes bubble-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
      }

      18% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15);
      }
    }

    .contact {
      position: absolute;
      left: 50%;
      bottom: clamp(24px, 5vh, 42px);
      transform: translateX(-50%);
      margin: 0;
      z-index: 4;
      font-size: 15px;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .plant {
      position: absolute;
      bottom: 0;
      width: 170px;
      height: 270px;
      z-index: 1;
      color: #3f5b53;
    }

    .plant.left {
      left: 0;
    }

    .plant.right {
      right: 0;
      transform: scaleX(-1);
    }

    .plant svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .plant .solid {
      fill: currentColor;
      opacity: 0.96;
    }

    .plant .line {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.75;
    }

    @media (max-width: 900px) {
      .page {
        width: 100vw;
        min-height: 100vh;
        padding-top: 190px;
      }

      .brand {
        top: 42px;
        left: 26px;
      }

      .brand-name {
        font-size: 15px;
      }

      .tagline {
        max-width: 320px;
        font-size: 11px;
        letter-spacing: 2px;
      }

      .login-area {
        width: min(86vw, 430px);
      }

      .login-card {
        height: 220px;
        padding: 34px 26px;
        border-radius: 38px;
        box-shadow: 16px 17px 0 #bc8152;
      }

      .field,
      .field input,
      .forgot {
        font-size: 14px;
        letter-spacing: 2px;
      }

      .btn {
        width: min(300px, 74vw);
      }

      .plant {
        opacity: 0.75;
      }

      .contact {
        bottom: 28px;
        max-width: 86vw;
        overflow-wrap: anywhere;
        white-space: normal;
        text-align: center;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand" aria-label="MotorCare Edge AI">
      <svg class="mark" viewBox="0 0 42 70" fill="none" aria-hidden="true">
        <path d="M27 3 8 31h15L14 67l21-39H20L27 3Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <path d="M33 15 15 38h12L9 58" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      <h1 class="brand-name">MotorCare<br>Edge AI</h1>
      <p class="tagline">Giám sát sức khoẻ motor bằng AI nhúng</p>
    </header>

    <section class="login-area" aria-label="Đăng ký">
      <form class="login-card register-card" id="register-form">
        <label class="field">
          <span class="icon user" aria-hidden="true"></span>
          <input type="text" name="fullname" placeholder="Họ tên" autocomplete="name" />
        </label>
        <label class="field">
          <span class="icon mail" aria-hidden="true"></span>
          <input type="email" name="email" placeholder="Email" autocomplete="email" />
        </label>
        <label class="field">
          <span class="icon fingerprint" aria-hidden="true"></span>
          <input type="password" name="password" placeholder="Mật khẩu" autocomplete="new-password" />
        </label>
      </form>

      <div class="actions">
        <button class="btn" type="submit" form="register-form">đăng ký</button>
        <button class="btn" type="button" data-link="index.html">đăng nhập</button>
      </div>
    </section>

    <p class="contact">Liên hệ: 23137001@student.hcmus.edu.vn</p>

    <div class="plant left" aria-hidden="true">
      <svg viewBox="0 0 180 280">
        <path class="line" d="M86 282 C78 226 78 176 91 124 C99 92 108 59 126 25" />
        <path class="line" d="M88 235 C61 215 38 195 18 167" />
        <path class="solid" d="M88 236 C51 222 25 193 8 155 C42 172 73 194 88 236Z" />
        <path class="line" d="M92 187 C70 159 55 132 48 100" />
        <path class="solid" d="M92 188 C62 165 47 132 46 88 C76 115 94 145 92 188Z" />
        <path class="line" d="M99 146 C122 119 136 92 143 59" />
        <path class="solid" d="M99 147 C124 119 140 87 146 45 C159 88 145 124 99 147Z" />
        <path class="line" d="M79 256 C55 239 33 221 12 198" />
        <path class="line" d="M105 226 C130 204 148 178 160 146" />
        <path class="line" d="M105 226 C126 194 143 169 160 132 C167 169 148 206 105 226Z" />
        <path class="line" d="M106 269 C127 250 143 230 155 205" />
        <path class="solid" d="M106 270 C133 250 151 222 163 190 C169 227 148 260 106 270Z" />
      </svg>
    </div>

    <div class="plant right" aria-hidden="true">
      <svg viewBox="0 0 180 280">
        <path class="line" d="M86 282 C78 226 78 176 91 124 C99 92 108 59 126 25" />
        <path class="line" d="M88 235 C61 215 38 195 18 167" />
        <path class="solid" d="M88 236 C51 222 25 193 8 155 C42 172 73 194 88 236Z" />
        <path class="line" d="M92 187 C70 159 55 132 48 100" />
        <path class="solid" d="M92 188 C62 165 47 132 46 88 C76 115 94 145 92 188Z" />
        <path class="line" d="M99 146 C122 119 136 92 143 59" />
        <path class="solid" d="M99 147 C124 119 140 87 146 45 C159 88 145 124 99 147Z" />
        <path class="line" d="M79 256 C55 239 33 221 12 198" />
        <path class="line" d="M105 226 C130 204 148 178 160 146" />
        <path class="line" d="M105 226 C126 194 143 169 160 132 C167 169 148 206 105 226Z" />
        <path class="line" d="M106 269 C127 250 143 230 155 205" />
        <path class="solid" d="M106 270 C133 250 151 222 163 190 C169 227 148 260 106 270Z" />
      </svg>
    </div>
  </main>
  <script>
    document.getElementById("register-form").addEventListener("submit", (event) => {
      event.preventDefault();
    });

    document.querySelectorAll(".btn").forEach((button) => {
      button.addEventListener("click", (event) => {
        const rect = button.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;

        for (let i = 0; i < 9; i += 1) {
          const bubble = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 9;
          const distance = 34 + Math.random() * 34;
          const size = 9 + Math.random() * 12;

          bubble.className = "bubble";
          bubble.style.setProperty("--x", `${clickX}px`);
          bubble.style.setProperty("--y", `${clickY}px`);
          bubble.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
          bubble.style.setProperty("--dy", `${Math.sin(angle) * distance - 18}px`);
          bubble.style.setProperty("--s", `${size}px`);

          button.appendChild(bubble);
          bubble.addEventListener("animationend", () => bubble.remove());
        }

        if (button.dataset.link) {
          window.setTimeout(() => {
            window.location.href = button.dataset.link;
          }, 180);
        }
      });
    });
  </script>
</body>
</html>
