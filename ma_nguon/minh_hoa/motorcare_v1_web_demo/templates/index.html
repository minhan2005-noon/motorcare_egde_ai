<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotorCare V1 | Theo dõi quạt</title>
  <style>
    :root { color-scheme: light; --ink:#172b43; --muted:#64748b; --line:#dce5eb; --teal:#007f82; }
    * { box-sizing:border-box }
    body { margin:0; background:#f3f6f8; color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif }
    main { max-width:980px; margin:34px auto; padding:0 18px }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px }
    h1 { margin:0; font-size:clamp(25px,4vw,36px); letter-spacing:-.03em }
    .sub,.muted { color:var(--muted) }
    .badge { border-radius:999px; padding:7px 12px; font-weight:700; background:#e2e8f0; white-space:nowrap }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px }
    .card { background:white; border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 4px 16px #172b4308 }
    .status { margin-bottom:14px; border-left:6px solid #94a3b8 }
    .status.normal { border-left-color:#16a34a }
    .status.fault { border-left-color:#dc2626 }
    .status h2 { margin:5px 0; font-size:28px }
    .status p { margin:0 }
    .metric-label { color:var(--muted); font-size:14px }
    .metric { font-size:27px; font-weight:750; margin-top:7px }
    .section-title { font-size:19px; margin:22px 0 10px }
    .prob { margin:14px 0 }
    .prob-head { display:flex; justify-content:space-between; margin-bottom:5px }
    .track { height:10px; border-radius:9px; overflow:hidden; background:#e2e8f0 }
    .fill { height:100%; width:0; background:var(--teal); transition:width .2s }
    .fill.high { background:#dc2626 }
    table { width:100%; border-collapse:collapse; background:white; border-radius:12px; overflow:hidden }
    th,td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:14px }
    th { background:#eaf0f3 }
    .empty { color:var(--muted); padding:16px 4px }
    @media (max-width:650px) { header { align-items:flex-start; flex-direction:column } .grid { grid-template-columns:1fr } }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>MotorCare</h1><div class="sub">Theo dõi tình trạng quạt • V1</div></div>
    <div id="connection" class="badge">Đang chờ ESP32</div>
  </header>

  <section id="statusCard" class="card status">
    <div class="metric-label">KẾT LUẬN MỚI NHẤT</div>
    <h2 id="state">Chưa nhận dữ liệu</h2>
    <p class="muted">Cập nhật: <span id="receivedAt">—</span></p>
  </section>

  <section class="grid" aria-label="Thông số cảm biến">
    <div class="card"><div class="metric-label">Điện áp BUS</div><div id="voltage" class="metric">—</div></div>
    <div class="card"><div class="metric-label">Dòng điện</div><div id="current" class="metric">—</div></div>
    <div class="card"><div class="metric-label">Rung động RMS</div><div id="vibration" class="metric">—</div></div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2 class="section-title" style="margin-top:0">Xác suất mô hình</h2>
    <div class="prob"><div class="prob-head"><span>Kẹt tải</span><b id="jamText">—</b></div><div class="track"><div id="jamBar" class="fill"></div></div></div>
    <div class="prob"><div class="prob-head"><span>Rung</span><b id="vibText">—</b></div><div class="track"><div id="vibBar" class="fill"></div></div></div>
    <div class="prob"><div class="prob-head"><span>Sụt áp</span><b id="sagText">—</b></div><div class="track"><div id="sagBar" class="fill"></div></div></div>
  </section>

  <h2 class="section-title">Lịch sử gần đây</h2>
  <div id="historyEmpty" class="empty">Chưa có lần dự đoán nào.</div>
  <table id="historyTable" hidden>
    <thead><tr><th>Thời gian nhận</th><th>Trạng thái</th><th>V</th><th>mA</th></tr></thead>
    <tbody id="historyBody"></tbody>
  </table>
</main>
<script>
  const names = {
    normal:"BÌNH THƯỜNG", jam:"KẸT TẢI", vibration:"RUNG", sag:"SỤT ÁP",
    "jam+sag":"KẸT TẢI + SỤT ÁP", "vibration+sag":"RUNG + SỤT ÁP",
    "jam+vibration":"KẸT TẢI + RUNG", "jam+vibration+sag":"KẸT TẢI + RUNG + SỤT ÁP"
  };
  const percent = value => `${(Number(value) * 100).toFixed(1)}%`;
  const timeText = value => new Date(value).toLocaleTimeString("vi-VN");
  function setProbability(id, textId, value) {
    const amount = Math.max(0, Math.min(100, Number(value) * 100));
    document.getElementById(textId).textContent = percent(value);
    const bar = document.getElementById(id);
    bar.style.width = `${amount}%`;
    bar.classList.toggle("high", amount >= 50);
  }
  async function refresh() {
    try {
      const response = await fetch("/api/latest", {cache:"no-store"});
      if (!response.ok) throw new Error("server");
      const result = await response.json();
      const badge = document.getElementById("connection");
      if (!result.received) { badge.textContent = "Đang chờ ESP32"; return; }
      const d = result.data;
      const title = names[d.state] || d.state;
      document.getElementById("state").textContent = title;
      document.getElementById("statusCard").classList.toggle("normal", d.state === "normal");
      document.getElementById("statusCard").classList.toggle("fault", d.state !== "normal");
      document.getElementById("receivedAt").textContent = new Date(d.received_at).toLocaleString("vi-VN");
      document.getElementById("voltage").textContent = `${Number(d.voltage_v).toFixed(2)} V`;
      document.getElementById("current").textContent = `${Number(d.current_ma).toFixed(1)} mA`;
      document.getElementById("vibration").textContent = `${Number(d.vibration_rms_g).toFixed(3)} g`;
      setProbability("jamBar","jamText",d.jam_probability);
      setProbability("vibBar","vibText",d.vibration_probability);
      setProbability("sagBar","sagText",d.sag_probability);
      badge.textContent = "ESP32 đang gửi dữ liệu";
      badge.style.background = "#dcfce7";
      await refreshHistory();
    } catch (_) {
      const badge = document.getElementById("connection");
      badge.textContent = "Mất kết nối tới server";
      badge.style.background = "#fee2e2";
    }
  }
  async function refreshHistory() {
    const response = await fetch("/api/history", {cache:"no-store"});
    const items = await response.json();
    const tbody = document.getElementById("historyBody");
    tbody.replaceChildren();
    for (const d of items.slice(0,10)) {
      const row = document.createElement("tr");
      for (const value of [timeText(d.received_at), names[d.state] || d.state,
                           `${Number(d.voltage_v).toFixed(2)} V`, `${Number(d.current_ma).toFixed(1)} mA`]) {
        const cell = document.createElement("td"); cell.textContent = value; row.appendChild(cell);
      }
      tbody.appendChild(row);
    }
    document.getElementById("historyTable").hidden = items.length === 0;
    document.getElementById("historyEmpty").hidden = items.length !== 0;
  }
  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
