<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Đăng nhập hệ thống giám sát sức khỏe motor MotorCare Edge AI">
  <title>Đăng nhập · MotorCare Edge AI</title>
  <link rel="stylesheet" href="/css/xac_thuc.css">
  <link rel="stylesheet" href="/css/nang_cap_xac_thuc.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual" aria-label="MotorCare Edge AI">
      <div class="auth-brand">
        <span class="auth-logo">M</span>
        <span>
          <strong>MotorCare Edge AI</strong>
          <strong>GIÁM SÁT SỨC KHỎE MOTOR</strong>
        </span>
      </div>
      <div class="auth-message">
        <p>Condition monitoring</p>
        <h1 class="fix_1">THE GAY TEAM</h1>
        <small class="fix_2">Dữ liệu rung động, dòng điện, nhiệt độ và âm thanh được tập trung trong một dashboard vận hành.</small>
      </div>
      <div class="signal-board" aria-hidden="true">
        <span style="--signal-height: 42%"></span>
        <span style="--signal-height: 78%"></span>
        <span style="--signal-height: 55%"></span>
        <span style="--signal-height: 88%"></span>
      </div>
    </section>

    <section class="auth-panel">
      <header class="auth-panel-head">
        <h2>Đăng nhập</h2>
        <p>Nhập tài khoản để mở dashboard giám sát thiết bị.</p>
      </header>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-alert" id="formAlert" role="alert" hidden></div>
        <div class="auth-field">
          <label for="email">Email</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="email" name="email" type="email" autocomplete="email" placeholder="name@company.com" required>
          </div>
          <p class="field-error" data-error-for="email"></p>
        </div>
        <div class="auth-field">
          <label for="password">Mật khẩu</label>
          <div class="auth-input-wrap">
            <input class="auth-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
            <button class="input-action" type="button" data-toggle-password="password" title="Hiện hoặc ẩn mật khẩu">◉</button>
          </div>
          <p class="field-error" data-error-for="password"></p>
        </div>
        <div class="auth-options">
          <label class="check-label">
            <input id="rememberMe" type="checkbox">
            Duy trì đăng nhập
          </label>
          <a class="auth-link" href="/forgot-password">Quên mật khẩu?</a>
        </div>
        <button class="auth-button" id="submitButton" type="submit">Đăng nhập</button>
      </form>

      <p class="auth-foot">Chưa có tài khoản? <a class="auth-link" href="/register">Tạo tài khoản</a></p>
    </section>
  </main>

  <script defer src="/js/giao_tiep_api/http.js"></script>
  <script defer src="/js/giao_tiep_api/xac_thuc.api.js"></script>
  <script defer src="/js/giao_dien_xac_thuc.js"></script>
  <script defer src="/js/dang_nhap.js"></script>
</body>
</html>
